{
  "name": "Build Liner Android APK",
  "on": {
    "workflow_dispatch": {}
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Set up Node.js 20",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "name": "Set up Java 17",
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "name": "Install pnpm",
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": 9
          }
        },
        {
          "name": "Clone upstream Liner source",
          "run": "git clone --depth 1 https://github.com/hakimz07/desktop.git upstream-src"
        },
        {
          "name": "Apply overlay files to upstream",
          "run": "mkdir -p upstream-src/src/android\nif [ -d \"overlay\" ]; then cp -rf overlay/* upstream-src/; fi\nif [ -f \"capacitor.config.json\" ]; then cp -f capacitor.config.json upstream-src/; fi\n"
        },
        {
          "name": "Configure pnpm workspace & install dependencies",
          "working-directory": "upstream-src",
          "run": "printf \"packages:\\n  - '.'\\nallowBuilds:\\n  electron-winstaller: true\\n\" > pnpm-workspace.yaml\npnpm install --no-frozen-lockfile\npnpm add -w @capacitor/core@^6.0.0\npnpm add -w -D @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0\n"
        },
        {
          "name": "Ensure mobile config and Android bridge files exist",
          "working-directory": "upstream-src",
          "run": "node -e 'const fs = require(\"fs\"); const path = require(\"path\");\n// 1. Ensure capacitor.config.json has CapacitorHttp enabled\nconst capCfg = {\n  appId: \"com.hkamori.liner\",\n  appName: \"Liner\",\n  webDir: \"dist\",\n  server: { androidScheme: \"https\", cleartext: true },\n  android: { allowMixedContent: true },\n  plugins: { CapacitorHttp: { enabled: true } }\n};\nfs.writeFileSync(\"capacitor.config.json\", JSON.stringify(capCfg, null, 2));\nconsole.log(\"Wrote capacitor.config.json with CapacitorHttp enabled\");\n\n// 2. Ensure vite.config.mobile.ts exists\nif (!fs.existsSync(\"vite.config.mobile.ts\")) {\n  const mobileVite = `import { defineConfig } from \"vite\";\\nimport react from \"@vitejs/plugin-react\";\\nimport tailwindcss from \"@tailwindcss/vite\";\\nimport path from \"path\";\\nimport pkg from \"./package.json\" with { type: \"json\" };\\nimport { contentSecurityPolicyPlugin } from \"./vite.csp\";\\nexport default defineConfig({\\n  define: { __APP_VERSION__: JSON.stringify(pkg.version) },\\n  plugins: [react(), tailwindcss(), contentSecurityPolicyPlugin()],\\n  resolve: {\\n    alias: {\\n      \"@\": path.resolve(import.meta.dirname, \"./src\"),\\n      \"next/navigation\": path.resolve(import.meta.dirname, \"./src/lib/navigation.tsx\"),\\n      \"next/link\": path.resolve(import.meta.dirname, \"./src/lib/navigation.tsx\"),\\n      \"next/image\": path.resolve(import.meta.dirname, \"./src/components/ui/AppImage.tsx\"),\\n    },\\n  },\\n  server: { port: 5173, strictPort: true },\\n  build: { outDir: \"dist\", emptyOutDir: true },\\n});`;\n  fs.writeFileSync(\"vite.config.mobile.ts\", mobileVite);\n  console.log(\"Created vite.config.mobile.ts\");\n}\n\n// 3. Ensure src/main.tsx imports androidBridge at top\nconst mainTsxPath = \"src/main.tsx\";\nif (fs.existsSync(mainTsxPath)) {\n  let code = fs.readFileSync(mainTsxPath, \"utf8\");\n  if (!code.includes(\"androidBridge\")) {\n    code = `import \"@capacitor/core\";\\nimport \"./androidBridge\";\\n` + code;\n    fs.writeFileSync(mainTsxPath, code);\n    console.log(\"Injected androidBridge import into src/main.tsx\");\n  }\n}'"
        },
        {
          "name": "Patch search hooks for null-safety",
          "working-directory": "upstream-src",
          "run": "node -e 'const fs = require(\"fs\"); const path = require(\"path\"); const hooksDir = \"src/features/search/hooks\"; if (fs.existsSync(hooksDir)) { fs.readdirSync(hooksDir).forEach(f => { const fp = path.join(hooksDir, f); let c = fs.readFileSync(fp, \"utf8\"); c = c.replace(/setItems\\(res\\.items\\);/g, \"setItems(Array.isArray(res?.items) ? res.items : []);\"); c = c.replace(/\\[items\\.length,/g, \"[(items || []).length,\"); c = c.replace(/res\\.items\\.filter/g, \"(Array.isArray(res?.items) ? res.items : []).filter\"); c = c.replace(/tracks\\.length/g, \"(tracks || []).length\"); fs.writeFileSync(fp, c); console.log(\"Patched search hook:\", f); }); }'"
        },
        {
          "name": "Patch audio player & YouTube resolver for Android WebView",
          "working-directory": "upstream-src",
          "run": "node -e 'const fs = require(\"fs\"); const path = require(\"path\");\n// 1. Remove audio.crossOrigin = \"anonymous\" so <audio> is not blocked by CORS on googlevideo streams\nconst prPath = \"src/features/player/engine/playerRuntime.ts\";\nif (fs.existsSync(prPath)) {\n  let pr = fs.readFileSync(prPath, \"utf8\");\n  pr = pr.replace(/audio\\.crossOrigin\\s*=\\s*\"anonymous\";/g, \"/* audio.crossOrigin omitted for Android WebView */\");\n  fs.writeFileSync(prPath, pr);\n  console.log(\"Patched playerRuntime.ts: removed audio.crossOrigin CORS requirement\");\n}\n// 2. Put VISIONOS and ANDROID_VR first in PLAYBACK_PROFILES (direct stream, no cipher, no JS player)\nconst ppPath = \"src/shared/youtube/innertube/playbackProfiles.ts\";\nif (fs.existsSync(ppPath)) {\n  let pp = fs.readFileSync(ppPath, \"utf8\");\n  pp = pp.replace(/export const PLAYBACK_PROFILES: readonly InnertubeProfile\\[\\] = \\[\\s*TV_PROFILE,\\s*VISIONOS_PROFILE,\\s*ANDROID_VR_PROFILE,\\s*\\];/g, \"export const PLAYBACK_PROFILES: readonly InnertubeProfile[] = [ VISIONOS_PROFILE, ANDROID_VR_PROFILE, TV_PROFILE ];\");\n  fs.writeFileSync(ppPath, pp);\n  console.log(\"Patched playbackProfiles.ts: prioritized VISIONOS and ANDROID_VR\");\n}\n// 3. Skip WebRemix without desktop PoToken\nconst iaPath = \"src/shared/youtube/innertube/innertubeAudio.ts\";\nif (fs.existsSync(iaPath)) {\n  let ia = fs.readFileSync(iaPath, \"utf8\");\n  ia = ia.replace(/if \\(!options\\.profiles && Date\\.now\\(\\) >= webRemixRetryAt\\) \\{/g, \"if (!options.profiles && Date.now() >= webRemixRetryAt && typeof window !== \\\"undefined\\\" && Boolean((window as any).linerElectron?.mintPoToken)) {\");\n  fs.writeFileSync(iaPath, ia);\n  console.log(\"Patched innertubeAudio.ts: bypassed WebRemix on mobile\");\n}\n// 4. Make streamProbe safe and non-fatal\nconst spPath = \"src/shared/youtube/innertube/streamProbe.ts\";\nif (fs.existsSync(spPath)) {\n  let sp = fs.readFileSync(spPath, \"utf8\");\n  sp = sp.replace(/if \\(!response\\.ok\\)\\s*throw new InnertubeError\\(\\s*`stream url rejected with \\$\\{response\\.status\\}`,/g, \"if (!response.ok) { console.warn(`[StreamProbe] stream url rejected with ${response.status} (ignored on mobile)`); return; }\\n    if (false) throw new InnertubeError(`stream url rejected with ${response.status}`,\");\n  fs.writeFileSync(spPath, sp);\n  console.log(\"Patched streamProbe.ts: probe is now safe and non-fatal\");\n}\n// 5. Explicitly inject Origin and Referer headers into innertubeClient\nconst icPath = \"src/shared/youtube/innertube/innertubeClient.ts\";\nif (fs.existsSync(icPath)) {\n  let ic = fs.readFileSync(icPath, \"utf8\");\n  ic = ic.replace(/\"x-origin\": profile\\.origin,/g, \"\\\"x-origin\\\": profile.origin,\\n    \\\"Origin\\\": profile.origin,\\n    \\\"Referer\\\": `${profile.origin}/`,\");\n  fs.writeFileSync(icPath, ic);\n  console.log(\"Patched innertubeClient.ts: added explicit Origin and Referer\");\n}'"
        },
        {
          "name": "Build web bundle with mobile config",
          "working-directory": "upstream-src",
          "run": "pnpm exec vite build --config vite.config.mobile.ts"
        },
        {
          "name": "Capacitor add Android & sync",
          "working-directory": "upstream-src",
          "run": "npx cap add android || true\nnpx cap sync android\n"
        },
        {
          "name": "Configure Android Manifest & WebView media settings",
          "working-directory": "upstream-src/android",
          "run": "node -e 'const fs = require(\"fs\"); const path = require(\"path\");\n// 1. AndroidManifest.xml permissions\nconst p = \"app/src/main/AndroidManifest.xml\";\nif (fs.existsSync(p)) {\n  let xml = fs.readFileSync(p, \"utf8\");\n  const perms = \"\\n    <uses-permission android:name=\\\"android.permission.INTERNET\\\" />\\n    <uses-permission android:name=\\\"android.permission.ACCESS_NETWORK_STATE\\\" />\\n    <uses-permission android:name=\\\"android.permission.WAKE_LOCK\\\" />\\n    <uses-permission android:name=\\\"android.permission.FOREGROUND_SERVICE\\\" />\\n    <uses-permission android:name=\\\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\\\" />\";\n  if (!xml.includes(\"INTERNET\")) xml = xml.replace(\"<application\", perms + \"\\n    <application\");\n  if (!xml.includes(\"usesCleartextTraffic\")) xml = xml.replace(\"<application\", \"<application android:usesCleartextTraffic=\\\"true\\\"\");\n  fs.writeFileSync(p, xml);\n  console.log(\"AndroidManifest.xml updated\");\n}\n// 2. Patch MainActivity.java to disable user gesture requirement for media & allow mixed content\nfunction findMain(dir) {\n  for (const item of fs.readdirSync(dir)) {\n    const full = path.join(dir, item);\n    if (fs.statSync(full).isDirectory()) {\n      const res = findMain(full);\n      if (res) return res;\n    } else if (item === \"MainActivity.java\") return full;\n  }\n  return null;\n}\nconst mainJavaPath = findMain(\"app/src/main/java\");\nif (mainJavaPath && fs.existsSync(mainJavaPath)) {\n  let code = fs.readFileSync(mainJavaPath, \"utf8\");\n  code = code.replace(/public class MainActivity extends BridgeActivity\\s*\\{[^}]*\\}/s, `public class MainActivity extends BridgeActivity {\\n    @Override\\n    public void onCreate(android.os.Bundle savedInstanceState) {\\n        super.onCreate(savedInstanceState);\\n        if (this.bridge != null && this.bridge.getWebView() != null) {\\n            android.webkit.WebSettings s = this.bridge.getWebView().getSettings();\\n            s.setMediaPlaybackRequiresUserGesture(false);\\n            s.setAllowFileAccess(true);\\n            s.setDomStorageEnabled(true);\\n            s.setDatabaseEnabled(true);\\n            s.setMixedContentMode(android.webkit.WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);\\n        }\\n    }\\n\\n    @Override\\n    public void onResume() {\\n        super.onResume();\\n        if (this.bridge != null && this.bridge.getWebView() != null) {\\n            this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);\\n        }\\n    }\\n}`);\n  fs.writeFileSync(mainJavaPath, code);\n  console.log(\"MainActivity.java patched for media playback:\", mainJavaPath);\n}'"
        },
        {
          "name": "Build Debug APK via Gradle",
          "working-directory": "upstream-src/android",
          "run": "chmod +x gradlew && ./gradlew assembleDebug --no-daemon"
        },
        {
          "name": "Upload APK Artifact",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "liner-debug-apk",
            "path": "upstream-src/android/app/build/outputs/apk/debug/app-debug.apk",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
